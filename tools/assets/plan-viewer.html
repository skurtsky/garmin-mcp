<script>
"use strict";
let PLAN = JSON.parse(document.getElementById('plan-data').textContent);
/* Served by garmin-mcp from PostgreSQL: the plan's id/status/version
   (active, future or archived), whether it's read-only (archived), which
   workouts are complete, and the plans just before / after it. Everything the
   viewer changes is sent back to the server, so every device sees the same
   plan, ticks, edits and zones. */
let SERVER = JSON.parse(document.getElementById('plan-server').textContent);
const READ_ONLY = !!SERVER.readOnly;
const FUTURE = SERVER.status === 'future';
/* The plans just before and after this one in time (among the active and
   future plans): paging past either end of this plan carries on into them,
   and the month view shows their days faded. Archived plans have none. */
const NEIGHBORS = SERVER.neighbors || {};

/* Links to sibling routes on whatever app is currently serving this page
   (e.g. /dashboard, /weekly-summary). Using a root-relative path means the
   browser resolves it against the current origin automatically — no need to
   know the domain, and it works the same on localhost, a deployed host, or
   behind a different domain later. The current query string (auth tokens,
   etc.) is carried over unchanged. */
const APP_QUERY = (typeof window !== 'undefined' && window.location && window.location.search) || '';
function appLink(path) { return path + APP_QUERY; }
/* A Garmin activity's detail, on the dashboard (it opens straight away there,
   and closing it comes back here). Carries the ?token= auth. */
/* Another plan's viewer, keeping the ?token= auth; ``params`` opens it at a
   week or month (?week=, ?month=). The active plan is the bare URL. */
function planHref(p, params) {
  const q = new URLSearchParams(APP_QUERY);
  ['plan', 'week', 'month', 'view'].forEach(k => q.delete(k));
  if (p.status !== 'active') q.set('plan', p.id);
  Object.keys(params || {}).forEach(k => q.set(k, params[k]));
  return '/training-plan' + (q.toString() ? '?' + q.toString() : '');
}
function goToPlan(p, params) { window.location.href = planHref(p, params); }
function activityLink(id) {
  const q = new URLSearchParams({ tab: 'activity', activity: String(id), from: 'plan' });
  const token = new URLSearchParams(APP_QUERY).get('token');
  if (token) q.set('token', token);
  return '/dashboard?' + q.toString();
}

/* Server calls. Paths are the viewer's JSON API under /training-plan/api/;
   APP_QUERY carries the ?token= auth and any ?plan= selection. Every write
   answers with the updated plan, which replaces the local copy. */
function api(path, body) {
  const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  return fetch(appLink('/training-plan/api/' + path), opts).then(res => res.json().catch(() => ({})).then(data => {
    if (!res.ok) throw new Error(data.error || ('Server returned ' + res.status));
    return data;
  }));
}
function applyServer(data) {
  PLAN = data.plan;
  SERVER = Object.assign({}, SERVER, { version: data.version, status: data.status, completed: data.completed || {}, skipped: data.skipped || {}, skipReasons: data.skipReasons || {},
    activities: data.activities || {}, startTimes: data.startTimes || {}, carryover: data.carryover || null });
  syncStateFromPlan();
  state.revisions = null;
}
function saveOps(operations, onDone) {
  state.saving = true; render();
  return api('operations', { operations })
    .then(data => { applyServer(data); if (onDone) onDone(); })
    .catch(err => alert('Could not save: ' + err.message))
    .finally(() => { state.saving = false; render(); });
}

const SPORT_COLORS_DARK = { swim:'#5eb8c9', bike:'#7fb87a', run:'#d99a5e', strength:'#9184d9', brick:'#c97fa0', race:'#d9b35a', rest:'#7c8194' };
/* Darker hues for light mode, so the text on the tinted tags keeps 4.5:1 on white. */
const SPORT_COLORS_LIGHT = { swim:'#2b7f90', bike:'#4a8544', run:'#ad6a2c', strength:'#6e61c2', brick:'#a24f76', race:'#9a7a1f', rest:'#6a6f82' };
/* Read at render time, so a theme change only needs a re-render. */
const SPORT_COLORS = new Proxy({}, { get: (_, k) => (document.documentElement.dataset.theme === 'light' ? SPORT_COLORS_LIGHT : SPORT_COLORS_DARK)[k] });

/* Theme: a per-device preference ('dark' | 'light' | 'system', default dark),
   kept in localStorage and applied as <html data-theme>. The inline boot
   script in the page head applies it before first paint. */
function theme() { try { const t = localStorage.getItem('gm-theme'); return t === 'light' || t === 'system' ? t : 'dark'; } catch (e) { return 'dark'; } }
function applyTheme(t) {
  try { localStorage.setItem('gm-theme', t); } catch (e) {}
  document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (theme() === 'system') { applyTheme('system'); render(); } });
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
const ZONE_COLORS = { '1':'#6c93b0','2':'#5eb8ad','3':'#8fb85e','4':'#d9b35a','5a':'#d98a5e','5b':'#d9705e','5c':'#c9506a' };
/* Rouvy's own difficulty convention (blue/yellow/red) — reuses the same
   hues as ZONE_COLORS zone1/zone4/zone5c rather than inventing a new
   palette, since those already read as "easy/moderate/hardest" in this
   app. Indoor-season bike workouts only (reference/rouvy-indoor-season.md). */
const DIFFICULTY_COLORS = { Easy:'#6c93b0', Medium:'#d9b35a', Hard:'#c9506a' };
const PHASE_COLORS = { 'Prep':'#6c93b0','Base 1':'#5ea0b8','Base 2':'#5eb0a3','Base 3':'#7fb87a','Base':'#5eb0a3',
  'Build 1':'#b8b05e','Build 2':'#d9a05a','Build':'#b8b05e','Peak':'#d97a5e','Taper':'#9184d9','Race':'#d9506a' };

const ICONS = {
  caretUp:'<path d="M213.7 165.7a8 8 0 0 1-11.4 0L128 91.3l-74.3 74.4a8 8 0 0 1-11.4-11.4l80-80a8 8 0 0 1 11.4 0l80 80a8 8 0 0 1 0 11.4Z"/>',
  caretDown:'<path d="M213.7 101.7l-80 80a8 8 0 0 1-11.4 0l-80-80a8 8 0 0 1 11.4-11.4L128 164.7l74.3-74.4a8 8 0 0 1 11.4 11.4Z"/>',

/* Zone tokens embedded in a workout's humanReadable text — e.g.

    if (kind === 'bike-watts') {
      const z = tableRow(BIKE_POWER_PCT_TABLE, code);
      return (z && ov.ftp) ? rangeStr(pct(ov.ftp, z.low), pct(ov.ftp, z.high), String, 'W') : 'Zone ' + code;
    }
    if (kind === 'bike-hr') {
      const z = tableRow(HR_PCT_TABLE, code);
      return (z && ov.bikeLthr) ? rangeStr(pct(ov.bikeLthr, z.low), pct(ov.bikeLthr, z.high), String, 'bpm') : 'Zone ' + code + ' HR';
    }
    if (kind === 'swim-pace') {
      const z = tableRow(SWIM_PACE_OFFSET_TABLE, code);
      return (z && ov.cssSeconds != null) ? rangeStr(ov.cssSeconds + z.low, ov.cssSeconds + z.high, fmtMMSS, '/100m') : 'Zone ' + code + ' pace';
    }
    return match;
  });
}

function planTab() {
  const month = isMonth();
  const n = month ? weekForMonth(state.monthKey) : state.planWeekNumber;
  const wk = weekByNumber(n);
  const phase = phaseForWeek(n);
  const phaseColor = PHASE_COLORS[phase.name] || '#7c8194';
  const first = (PLAN.weeks || [])[0]?.weekNumber || 1;
  const last = PLAN.meta.totalWeeks || ((PLAN.weeks || []).slice(-1)[0]?.weekNumber || 1);

  const nonRest = allWorkouts().filter(x => x.wo.sport !== 'rest');
  const doneCount = nonRest.filter(x => state.completed[x.wo.id]).length;
  const skipCount = nonRest.filter(x => isSkipped(x.wo.id)).length;
  const pctDone = nonRest.length ? Math.round(doneCount / nonRest.length * 100) : 0;
  const range = wk ? dayMonth(wk.startDate) + ' – ' + (d(wk.startDate).getMonth() === d(wk.endDate).getMonth() ? d(wk.endDate).getDate() : dayMonth(wk.endDate)) : '';
  const race = RACE ? ' · Race day ' + longDate(RACE.date) : '';
  /* The week's planned training, from its workouts (so it follows every edit). */
  const weekWorkouts = wk ? (wk.days || []).flatMap(day => (day.workouts || []).filter(x => x.sport !== 'rest')) : [];
  const plannedMin = weekWorkouts.reduce((sum, x) => sum + (Number(x.durationMinutes) || 0), 0);

  const monthHeadHtml = () => {
    const st = monthStats(state.monthKey);
    const nums = [...new Set(monthGrid(state.monthKey).flat().map(dt => (dayIndex()[dt] || {}).weekNumber).filter(Boolean))];
    return '<div class="plan-head-week">' + esc(monthTitle(state.monthKey))
      + (nums.length ? ' <span class="plan-head-sub">· Weeks ' + nums[0] + (nums.length > 1 ? '–' + nums[nums.length - 1] : '') + '</span>' : '') + '</div>'
      + '<div class="plan-head-planned"><b>' + esc(st.min ? fmtDuration(st.min) : '0min') + '</b> planned · ' + st.n + ' session' + (st.n === 1 ? '' : 's') + ' · ' + st.done + ' done'
      + (st.skipped ? ' · <span style="color:var(--color-skip);">' + st.skipped + ' skipped</span>' : '') + '</div>';
  };
  let h = readOnlyBanner() + carryoverBanner() + '<div class="plan-head">'
    + '<div class="plan-head-main">'
      + '<div class="plan-head-kicker">' + esc(PLAN.meta.event) + esc(race) + '</div>'
      + (month ? monthHeadHtml() : '<div class="plan-head-week">Week ' + n + ' <span class="plan-head-sub">of ' + esc(last) + (range ? ' · ' + esc(range) : '') + '</span></div>')
      + (month ? '' : wk ? '<div class="plan-head-planned"><b>' + esc(plannedMin ? fmtDuration(plannedMin) : '0min') + '</b> planned'
          + ' · ' + weekWorkouts.length + ' session' + (weekWorkouts.length === 1 ? '' : 's') + '</div>' : '')
    + '</div>'
    + '<div class="plan-head-progress">'
      + '<div class="plan-head-row">'
        + '<label class="phase-pick"><span style="width:7px; height:7px; border-radius:50%; background:' + phaseColor + ';"></span>' + esc(phase.name)
          + '<select id="phase-select" aria-label="Jump to phase">'
          + (PLAN.phases || []).map(p => '<option value="' + esc(p.name) + '"' + (p.name === phase.name ? ' selected' : '') + '>' + esc(p.name) + ' (wk ' + p.startWeek + '–' + p.endWeek + ')</option>').join('')
          + '</select></label>'
        + '<span title="' + pctDone + '% of workouts complete' + (skipCount ? ' · ' + skipCount + ' skipped' : '') + '">' + doneCount + '/' + nonRest.length + '</span></div>'
      + '<div class="plan-bar"><div style="width:' + Math.max(pctDone, doneCount ? 2 : 0) + '%;"></div></div>'
    + '</div>'
    + '<div class="plan-head-nav">'
      + '<div class="seg view-seg" role="group" aria-label="Plan view">'
        + '<button type="button" class="seg-opt' + (month ? '' : ' on') + '" data-act="view-week" aria-pressed="' + !month + '">Week</button>'
        + '<button type="button" class="seg-opt' + (month ? ' on' : '') + '" data-act="view-month" aria-pressed="' + month + '">Month</button>'
        + '<a class="seg-opt" href="' + esc(appLink('/training-plan/season')) + '" title="Every plan on one timeline">Season</a></div>'
      + (month
        ? '<button type="button" class="btn btn-icon" data-act="prev"' + (monthAtEnd(-1) ? ' disabled' : '') + ' aria-label="Previous month">' + icon('left') + '</button>'
          + '<button type="button" class="btn btn-icon" data-act="next"' + (monthAtEnd(1) ? ' disabled' : '') + ' aria-label="Next month">' + icon('right') + '</button>'
        : '<button type="button" class="btn btn-icon" data-act="prev"' + (n <= 1 && !NEIGHBORS.prev ? ' disabled' : '')
            + ' aria-label="' + esc(n <= 1 && NEIGHBORS.prev ? 'Previous plan: ' + NEIGHBORS.prev.event : 'Previous week') + '">' + icon('left') + '</button>'
          + '<button type="button" class="btn btn-icon" data-act="next"' + (n >= last && !NEIGHBORS.next ? ' disabled' : '')
            + ' aria-label="' + esc(n >= last && NEIGHBORS.next ? 'Next plan: ' + NEIGHBORS.next.event : 'Next week') + '">' + icon('right') + '</button>')
    + '</div></div>';

  if (month) return h + monthNeighborNote(state.monthKey) + monthGridHtml();

  const focus = wk ? wk.focus : phase.focus;
  if (!month && (focus || (wk && wk.isRecoveryWeek))) {
    h += '<div class="plan-focus" data-act="toggle-focus" title="Show the whole note">' + (wk && wk.isRecoveryWeek ? '<span class="tag tag-accent-2" style="margin-right:8px;">Recovery week</span>' : '')
      + esc(focus || '') + '</div>';
  }

  if (!wk) {

      + icon('hourglass', 22) + '<div style="margin-top:8px; font-size:14px;">Not generated yet</div>'
      + '<div style="font-size:12px; margin-top:4px;">This week has no detail in the plan file.</div></div>';
    return h;
  }

  const dayDates = (wk.days || []).map(day => day.date);
  const byDate = {};
  allWorkouts().forEach(x => { if (dayDates.includes(x.date)) (byDate[x.date] = byDate[x.date] || []).push(x.wo); });

  h += '<div class="week-grid">' + (wk.days || []).map(day => {
    const workouts = byStartTime((byDate[day.date] || []).filter(w => w.sport !== 'rest'));
    const isToday = day.date === todayStr();
    return '<div class="day-col" data-day-date="' + esc(day.date) + '">'
      + '<div class="day-head' + (isToday ? ' today' : '') + '"><span style="font-family:var(--font-heading); font-size:14px; font-weight:500;' + (isToday ? ' color:var(--color-accent-300);' : '') + '">'
        + '<span class="dl-long">' + esc(day.dayOfWeek) + '</span><span class="dl-short">' + esc(String(day.dayOfWeek || '').slice(0, 3)) + '</span>' + (isToday ? ' · Today' : '') + '</span>'
      + '<span style="display:flex; align-items:center; gap:6px;"><span style="font-size:12px; color:' + (isToday ? 'var(--color-accent-400)' : 'var(--color-neutral-500)') + ';"><span class="dl-long">' + esc(dayMonth(day.date)) + '</span><span class="dl-short">' + d(day.date).getDate() + '</span></span>'
      + (READ_ONLY ? '' : '<button type="button" class="add-btn" data-act="add-workout" data-date="' + esc(day.date) + '" title="Add a workout on ' + esc(dayMonth(day.date)) + '" aria-label="Add workout">' + icon('plus', 14) + '</button>')
      + '</span></div>'
      + (workouts.length ? workouts.map(w => workoutCard(w, day.date)).join('') : '<div class="rest-slot" data-day-date="' + esc(day.date) + '">Rest day</div>')
    + '</div>';
  }).join('') + '</div>';
  if (n >= last) h += neighborCardHtml('next');
  if (n <= first) h += neighborCardHtml('prev');
  return h;
}

function goalRaceSection() {

/* Garmin Sync: when each kind of data last came in from Garmin, and a form
   that runs sync_garmin.py on the server with the flags the scheduled job
   would take. A run goes on in the background on the server; its log is
   saved as it runs, so leaving and coming back here picks it up again.
   While a run is going the runs card refreshes on its own, without
   re-rendering the form being filled in. */
const SYNC_FIELDS = {
  days: { flag: '--days', label: 'Recent days of daily metrics', type: 'number', placeholder: '3',
    hint: 'Sleep, HRV, readiness and the rest, for this many days back. Ignored when a start date is set.' },
  since: { flag: '--since', label: 'Daily metrics from', type: 'date' },
  end_date: { flag: '--end-date', label: 'Daily metrics to', type: 'date', hint: 'Blank: today.' },
  activities_since: { flag: '--activities-since', label: 'Activities from', type: 'date',
    hint: 'Every activity from this date — blank syncs just the latest 20. Activities deleted from Garmin in the range are removed.' },
  activities_end_date: { flag: '--activities-end-date', label: 'Activities to', type: 'date', hint: 'Blank: today.' },
  detail_limit: { flag: '--detail-limit', label: 'Activity details per run', type: 'number', placeholder: '10',
    hint: 'Splits, zones, routes and best efforts — several Garmin calls each, so large numbers take a while.' },
  overwrite: { flag: '--overwrite', label: 'Re-fetch details already stored', type: 'switch',
    hint: 'Refresh the most recent activities\' details even when they\'re current — after an update adds new fields.' },
  history_days: { flag: '--history-days', label: 'Days of history', type: 'number', placeholder: '365',
    hint: 'How far back to fill threshold (FTP, LTHR, pace, VO2max) and race-prediction history. Garmin allows up to 365.' },
};
const SYNC_MODES = {
  full: { flag: '', fields: ['days', 'since', 'end_date', 'activities_since', 'activities_end_date', 'detail_limit', 'overwrite'],
    text: 'Daily metrics, activities, activity details, records, profile, gear and goals — what the scheduled sync runs.' },
  daily: { flag: '--daily-only', fields: ['days', 'since', 'end_date'], text: 'Only daily health metrics — for backfilling trends.' },
  activities: { flag: '--activities-only', fields: ['activities_since', 'activities_end_date'], text: 'Only the activity list — for an activity history backfill.' },
  details: { flag: '--details-only', fields: ['detail_limit', 'overwrite'], text: 'Only activity details — e.g. a one-time backfill with a large limit.' },
  history: { flag: '--backfill-history', fields: ['history_days'], text: 'One-off: fill threshold and race-prediction history from Garmin, then stop.' },
};
const SYNC_STATUS = { running: 'Running', succeeded: 'Done', failed: 'Failed', cancelled: 'Cancelled', interrupted: 'Interrupted' };
function syncArgs(form) {
  const mode = SYNC_MODES[form.mode] || SYNC_MODES.full;
  const args = mode.flag ? [mode.flag] : [];
  mode.fields.forEach(k => {
    const v = form[k];
    if (SYNC_FIELDS[k].type === 'switch') { if (v) args.push(SYNC_FIELDS[k].flag); }
    else if (v !== undefined && v !== null && String(v).trim() !== '') args.push(SYNC_FIELDS[k].flag, String(v).trim());
  });
  return args;
}
function syncBody(form) {
  const body = { mode: form.mode };
  (SYNC_MODES[form.mode] || SYNC_MODES.full).fields.forEach(k => { if (form[k] !== undefined && form[k] !== '') body[k] = form[k]; });
  return body;
}
function agoLabel(iso) {
  if (!iso) return 'Never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'Just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function durationLabel(start, end) {
  const s = Math.max(0, Math.round(((end ? new Date(end) : new Date()) - new Date(start)) / 1000));
  return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
}
function syncRunning() { return !!(state.sync && state.sync.latest && state.sync.latest.status === 'running'); }

}
function syncSection() {

    + '<div style="font-size:13px; color:var(--color-neutral-400);">' + esc(state.syncError) + '</div></div>';
  if (!state.sync) return '<div class="card elev-sm" style="margin:12px 18px; padding:16px;"><div style="font-size:13px; color:var(--color-neutral-400);">Loading…</div></div>';

    return '<div><span>' + esc(t.label) + '</span><span' + (failed ? ' style="color:var(--color-danger);"' : '')
      + ' title="' + esc(failed ? (t.error || t.status) : t.lastSyncTime ? new Date(t.lastSyncTime).toLocaleString() : '') + '">'

/* ── Structured steps in the editor ──

    return parts.reduce((acc, v) => acc * 60 + v, 0);

  if (s.kind === 'exercise') {

      load: wave ? wave.join(', ') : (s.weightKg != null ? String(s.weightKg) : s.weightLb != null ? String(s.weightLb) : ''),
      rest: s.restS != null ? clockText(s.restS) : '', warmup: !!s.warmup, note: s.note || '' };

    if (u.note && u.note.trim()) out.note = u.note.trim();

  }
  if (u.kind === 'exercise') {
    const out = { kind: 'exercise', exercise: (u.exercise || '').trim().toUpperCase().replace(/[\s-]+/g, '_'), sets: parseInt(u.sets, 10) || 1 };
    if (u.mode === 'time') { const s = clockSeconds(u.time, 'sec'); if (s) out.durationS = s; }
    else if (u.reps !== '' && !isNaN(Number(u.reps))) out.reps = Number(u.reps);
    const loads = String(u.load || '').split(',').map(x => x.trim()).filter(Boolean).map(Number);
    if (loads.length > 1) out[u.unit === 'lb' ? 'setWeightsLb' : 'setWeightsKg'] = loads;
    else if (loads.length === 1 && !isNaN(loads[0])) out[u.unit === 'lb' ? 'weightLb' : 'weightKg'] = loads[0];
    const rest = clockSeconds(u.rest, 'sec');
    if (rest != null) out.restS = rest;

    if (u.note && u.note.trim()) out.note = u.note.trim();

    const s = clockSeconds(u.time, 'sec');

  const out = { kind: u.kind };
  if (u.amt === 'time') { const s = clockSeconds(u.time, 'min'); if (s) out.durationS = s; }
  if (u.amt === 'distance' && u.dist !== '' && !isNaN(Number(u.dist))) out.distanceM = Math.round(Number(u.dist) * (sport === 'swim' ? 1 : 1000));

let previewTimer = null, previewSeq = 0;

function draftToFields(d) {

  if (d.mode !== 'edit' || String(d.distance) !== String(d.distanceOrig) || d.sport !== d.sportOrig) {

/* The preview's bars and the builder's rows point at each other: each row's
   stripe is its bar's zone colour, and picking either one selects both. A
   repeat's row stands for its step in every rep. */
function barPaths(d) {
  const out = [];
  d.steps.forEach((u, i) => {
    if (u.kind !== 'repeat') return out.push(String(i));
    const count = Math.max(1, parseInt(u.count, 10) || 1);
    for (let r = 0; r < count; r++) u.steps.forEach((_, j) => out.push(i + '.' + j));
  });
  return out;
}
function weDecorate() {
  const d = state.editDraft;
  if (!d || d.sport === 'strength') return;
  const paths = barPaths(d);
  const bars = document.querySelectorAll('.we-graph .wd-bar');
  const fill = {};
  bars.forEach((b, i) => {
    const path = paths[i];
    b.setAttribute('data-we-bar', path == null ? '' : path);
    if (path != null && !(path in fill)) fill[path] = b.getAttribute('data-c');
    const on = path != null && path === state.weSel;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('[data-we-row]').forEach(r => {
    const path = r.getAttribute('data-we-row');
    r.classList.toggle('on', path === state.weSel);
    const stripe = r.querySelector('.we-stripe');
    if (stripe && fill[path]) stripe.style.background = fill[path];
  });
}
function weSelect(path, fromBar) {
  if (state.weSel === path) return;
  state.weSel = path;
  weDecorate();

    const row = document.querySelector('[data-we-row="' + path + '"]');

function stepAction(act, path) {
  const d = state.editDraft;
  if (act === 'add-in') { d.steps[Number(path)].steps.push(newStep(d.sport, 'step')); }
  else {
    const { list, i } = stepSlot(d, path);
    if (act === 'del') list.splice(i, 1);
    if (act === 'up' && i > 0) list.splice(i - 1, 0, list.splice(i, 1)[0]);
    if (act === 'down' && i < list.length - 1) list.splice(i + 1, 0, list.splice(i, 1)[0]);
    const parts = String(path).split('.');
    if (parts.length > 1 && !d.steps[Number(parts[0])].steps.length) d.steps.splice(Number(parts[0]), 1);
    state.weSel = null;
    state.weShape = null;
  }
  render();
  schedulePreview(true);
}
function editorAction(act) {
  const d = state.editDraft;
  if (act === 'use-total') { d.durationMinutes = String(d.preview.totalMinutes); render(); return; }
  d.steps.push(newStep(d.sport, act.replace('add-', '')));
  render();
  schedulePreview(true);
  const rows = document.querySelectorAll('.we-steps .we-row');
  const last = rows[rows.length - 1];
  if (last) { const first = last.querySelector('input, select'); if (first) first.focus(); }
}

function render() {
  const body = state.tab === 'settings' ? settingsTab() : planTab();
  // The editor re-renders as steps are added or reshaped: keep its scroll and
  // the field being edited.
  const scroller = document.querySelector('.we .wd-body');
  const sheet = document.querySelector('.we');
  const keep = { body: scroller ? scroller.scrollTop : 0, sheet: sheet ? sheet.scrollTop : 0 };
  const a = document.activeElement;
  const focusSel = a && a.getAttribute && (a.getAttribute('data-sk') ? '[data-step="' + a.getAttribute('data-step') + '"][data-sk="' + a.getAttribute('data-sk') + '"]'
    : a.getAttribute('data-edit-field') ? '[data-edit-field="' + a.getAttribute('data-edit-field') + '"]' : null);
  document.getElementById('app').innerHTML =
    '<div class="scroller"><div class="content-wrap">' + body + '</div></div>' + editModal()
    + (state.saving ? '<div class="saving-pill">Saving…</div>' : '');
  const scroller2 = document.querySelector('.we .wd-body');
  if (scroller2) scroller2.scrollTop = keep.body;
  const sheet2 = document.querySelector('.we');
  if (sheet2) sheet2.scrollTop = keep.sheet;
  document.documentElement.classList.toggle('wd-lock', !!state.editId);
  if (focusSel && state.editId) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  if (state.editDraft) weDecorate();
  pinSyncLog();
}

/* Move the Plan tab one week back (-1) or forward (+1), sliding the new week
   in from the side it comes from. A no-op at the plan's first / last week. */
function stepWeek(delta) {
  const target = state.planWeekNumber + delta;
  /* Past either end, carry on into the plan before / after this one. */
  if (target > PLAN.meta.totalWeeks && NEIGHBORS.next) return goToPlan(NEIGHBORS.next, { week: NEIGHBORS.next.firstWeek });
  if (target < 1 && NEIGHBORS.prev) return goToPlan(NEIGHBORS.prev, { week: NEIGHBORS.prev.lastWeek });
  const n = Math.min(PLAN.meta.totalWeeks, Math.max(1, target));
  if (n === state.planWeekNumber) return;
  state.planWeekNumber = n;
  render();
  const wrap = document.querySelector('#app .content-wrap');
  if (wrap) wrap.classList.add(delta > 0 ? 'slide-from-right' : 'slide-from-left');
}

function takeWorkoutStates(data) {
  SERVER.completed = data.completed || {}; SERVER.skipped = data.skipped || {}; SERVER.skipReasons = data.skipReasons || {};
  state.completed = Object.assign({}, SERVER.completed); state.skipped = Object.assign({}, SERVER.skipped);
  state.skipReasons = Object.assign({}, SERVER.skipReasons);
}
function toggleCompleted(id) {
  const next = !state.completed[id];
  const wasSkipped = state.skipped[id];
  state.completed[id] = next;                       // optimistic
  if (next) delete state.skipped[id];
  render();
  api('completion', { workout_id: id, completed: next })
    .then(takeWorkoutStates)
    .catch(err => { state.completed[id] = !next; if (wasSkipped) state.skipped[id] = wasSkipped; alert('Could not save: ' + err.message); })
    .finally(render);
}
document.getElementById('app').addEventListener('click', e => {
  if (e.target.closest('a[data-garmin]')) return;
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    e.stopPropagation();
    if (READ_ONLY) return;
    return toggleCompleted(toggle.getAttribute('data-toggle'));
  }
  const open = e.target.closest('[data-open]');
  if (open) return openWorkout(open.getAttribute('data-open'));


  const zone = e.target.closest('[data-zone]');
  if (zone) { state.zoneSport = zone.getAttribute('data-zone'); return render(); }

  /* The theme is a per-device setting, not plan data, so archived plans can change it. */
  const themePick = e.target.closest('[data-theme-pick]');
  if (themePick) { applyTheme(themePick.getAttribute('data-theme-pick')); return render(); }

  const unit = e.target.closest('[data-unit]');
  if (unit) {
    if (READ_ONLY) return;
    const value = unit.getAttribute('data-unit');
    if (value === state.unit) return;
    state.unit = value;
    return saveOps([{ op: 'set_unit', unit: value }]);
  }

  if (state.editDraft) {
    const shapeBtn = e.target.closest('[data-we-shape]');
    const opt = e.target.closest('[data-we-ramp]');
    const bar = e.target.closest('.we-graph .wd-bar');
    const row = e.target.closest('[data-we-row]');
    if (row) weSelect(row.getAttribute('data-we-row'), false);
    if (opt) {
      const u = stepAt(state.editDraft, opt.getAttribute('data-path'));
      if (u) u.ramp = opt.getAttribute('data-we-ramp');
      state.weShape = null;
      render();
      return schedulePreview(true);
    }
    if (shapeBtn) {
      const path = shapeBtn.getAttribute('data-we-shape');
      if (!isRange(stepAt(state.editDraft, path))) return;
      state.weShape = state.weShape === path ? null : path;
      return render();
    }
    if (state.weShape) { state.weShape = null; render(); }
    if (bar) { const path = bar.getAttribute('data-we-bar'); if (path) weSelect(path, true); return; }
  }
  const stepBtn = e.target.closest('[data-step-act]');
  if (stepBtn && state.editDraft) return stepAction(stepBtn.getAttribute('data-step-act'), stepBtn.getAttribute('data-path'));
  const weBtn = e.target.closest('[data-we-act]');
  if (weBtn && state.editDraft) return editorAction(weBtn.getAttribute('data-we-act'));

  const act = e.target.closest('[data-act]');
  const a = act ? act.getAttribute('data-act') : null;
  if (!act) return;
  if (a === 'backdrop' && e.target !== act) return;
  if (a === 'view-week' || a === 'view-month') return setPlanView(a.slice(5));
  /* Browsing a week is not an edit, so archived plans can do it too. */
  if (a === 'open-week') { state.planView = 'week'; persistView(); state.planWeekNumber = +act.dataset.week; return render(); }
  if (a === 'open-plan') return goToPlan(NEIGHBORS[act.dataset.neighbor], { month: state.monthKey });
  if (a === 'prev') return isMonth() ? stepMonth(-1) : stepWeek(-1);
  if (a === 'next') return isMonth() ? stepMonth(1) : stepWeek(1);
  if (a === 'close' || a === 'backdrop') { state.editId = null; state.editDraft = null; return render(); }
  if (a === 'toggle-focus') { act.classList.toggle('open'); return; }
  if (a === 'settings-cat') { state.settingsCat = act.dataset.cat; render(); window.scrollTo(0, 0); if (state.settingsCat === 'sync') loadSync({ quiet: true }); return; }
  if (a === 'settings-back') { state.settingsCat = null; render(); window.scrollTo(0, 0); return; }
  if (a === 'toggle-history') { state.historyOpen = !state.historyOpen; return render(); }
  // Syncing isn't part of the plan, so it works while viewing an archived plan too.
  if (a === 'sync-start') return startSync();
  if (a === 'sync-toggle') { const k = act.dataset.field; state.syncForm[k] = !state.syncForm[k]; return render(); }
  if (a === 'sync-latest') { state.syncRun = null; syncLogTop = null; return refreshSyncRuns(); }
  if (a === 'sync-open') {
    const id = Number(act.dataset.run);
    syncLogTop = null;
    if (state.sync && state.sync.latest && id === state.sync.latest.id) { state.syncRun = null; return refreshSyncRuns(); }
    return api('sync/runs/' + id).then(r => { state.syncRun = r; refreshSyncRuns(); scheduleSyncPoll(); })
      .catch(err => alert('Could not load that run: ' + err.message));
  }
  if (a === 'sync-cancel') {
    if (!confirm('Stop this sync? Whatever it already saved stays.')) return;
    return api('sync/runs/' + act.dataset.run + '/cancel', {}).then(() => loadSync({ quiet: true }))
      .catch(err => alert('Could not cancel: ' + err.message));
  }
  /* The calendar settings aren't part of the plan, so they stay editable
     while viewing an archived plan. */
  if (a && a.startsWith('cal-') && state.calendar && !state.saving) {
    const c = state.calendar;
    if (a === 'cal-add') {
      const slot = nextCalendarSlot(c, act.getAttribute('data-sport'));
      return slot ? saveCalendarSchedule(c.defaultTime, c.slots.concat([slot])) : undefined;
    }
    if (a === 'cal-remove') {
      const i = Number(act.getAttribute('data-index'));
      return saveCalendarSchedule(c.defaultTime, c.slots.filter((_, j) => j !== i));
    }
    if (a === 'cal-publish') {
      if (c.published && !confirm('Make a new link? The current link stops working, so calendars subscribed to it stop updating.')) return;
      return calendarCall('publish');
    }
    if (a === 'cal-revoke') {
      if (!confirm('Revoke the calendar link? Calendars subscribed to it stop updating.')) return;
      return calendarCall('revoke');
    }
    if (a === 'cal-copy') {
      const url = calendarUrl(c);
      const done = () => { state.calendarCopied = true; render(); setTimeout(() => { state.calendarCopied = false; render(); }, 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('Copy the calendar URL:', url));
      else prompt('Copy the calendar URL:', url);
      return;
    }
  }
  // The goal race isn't part of the plan, so it stays editable on archived plans.
  if (a === 'goal-add') { state.goalDraft = goalDraftFrom(null); state.goalError = ''; return render(); }
  if (a === 'goal-edit') { state.goalDraft = goalDraftFrom(state.goal.goal); state.goalError = ''; return render(); }
  if (a === 'goal-cancel') { state.goalDraft = null; state.goalError = ''; return render(); }
  if (a === 'goal-distance') { state.goalDraft.distance = act.getAttribute('data-key'); state.goalError = ''; return render(); }
  if (a === 'goal-toggle-today') {
    if (state.goalDraft) { state.goalDraft.show_on_today = !state.goalDraft.show_on_today; return render(); }
    const g = state.goal.goal;
    return goalSubmit('goal-race', Object.assign(goalDraftFrom(g), { show_on_today: !g.show_on_today }));
  }
  if (a === 'goal-save') {
    const f = state.goalDraft;
    if (!f.name.trim()) { state.goalError = 'Give the race a name.'; return render(); }
    if (!f.date) { state.goalError = 'Pick the race date.'; return render(); }
    return goalSubmit('goal-race', f, () => { state.goalDraft = null; });
  }
  if (a === 'tz-device') return tzSubmit(deviceZone());
  if (a === 'goal-clear') {
    if (!confirm('Clear the goal race? Today, Trends and Fitness stop showing it.')) return;
    return goalSubmit('goal-race/clear', {}, () => { state.goalDraft = null; });
  }
  if (READ_ONLY) return;
  if (a === 'validate') {
    const sport = act.getAttribute('data-sport');
    const cur = state.zonesValidated[sport];
    return saveOps([{ op: 'set_zone_validation', sport, validated: !(cur && cur.validated), at: new Date().toISOString().slice(0,10) }]);
  }
  if (a === 'carry-apply' || a === 'carry-dismiss') {
    const keys = [...document.querySelectorAll('[data-carry]:checked')].map(x => x.getAttribute('data-carry'));
    if (a === 'carry-apply' && !keys.length) return alert('Tick the thresholds to carry over, or keep this plan\'s.');
    state.saving = true; render();
    api(a === 'carry-apply' ? 'carryover' : 'carryover/dismiss', a === 'carry-apply' ? { keys } : {})
      .then(applyServer)
      .catch(err => alert('Could not save: ' + err.message))
      .finally(() => { state.saving = false; render(); });
    return;
  }
  if (a === 'restore') {
    const version = act.getAttribute('data-version');
    if (!confirm('Restore version ' + version + '? The current plan stays in history, so this can be undone.')) return;
    state.saving = true; render();
    api('revisions/' + encodeURIComponent(version) + '/restore', {})
      .then(applyServer)
      .catch(err => alert('Could not restore: ' + err.message))
      .finally(() => { state.saving = false; render(); });
    return;
  }
  if (a === 'add-workout') {
    state.editId = '__new__';
    state.editDraft = draftFor({ sport: 'run' }, act.getAttribute('data-date'), 'add');
    return render();
  }
  if (a === 'cancel-edit') { state.editId = null; state.editDraft = null; return render(); }
  if (a === 'save-edit') {
    const d = state.editDraft;
    if (!state.editId || !d || state.saving) return;
    if (!d.name.trim()) { alert('Give the workout a name.'); return; }
    if (!d.date) { alert('Pick a date.'); return; }
    const fields = draftToFields(d);
    const op = d.mode !== 'edit'
      ? { op: 'add_workout', date: d.date, workout: fields }
      : { op: 'update_workout', workout_id: state.editId, fields: Object.assign(fields, { date: d.date }) };
    return saveOps([op], () => { state.editId = null; state.editDraft = null; });
  }
});

/* A workout opens the shared workout view (tools/workout_detail.py) — the
   same one Today shows. Its completion, skip and Send to Garmin go through
   the API, after which the plan is reloaded underneath; Edit, Duplicate and
   Delete come back here to this page's own editor. */
function openWorkout(id) {
  if (!window.WD) return;
  window.WD.open(id, { inPlan: true, onChange: reloadPlan, onAction: workoutAction });
}
function reloadPlan() {
  return api('plan').then(data => { applyServer(data); render(); }).catch(() => { /* next load shows it */ });
}
function workoutAction(what, id) {
  if (READ_ONLY) return;
  const hit = workoutById(id);
  if (!hit) return;
  if (what === 'edit') { state.editId = id; state.editDraft = draftFor(hit.wo, hit.date, 'edit'); render(); return schedulePreview(true); }
  if (what === 'duplicate') { state.editId = '__new__'; state.editDraft = draftFor(hit.wo, hit.date, 'duplicate'); render(); return schedulePreview(true); }
  if (what === 'delete') {
    if (confirm('Delete this workout from the plan? It can be restored from Settings → History.')) {
      return saveOps([{ op: 'remove_workout', workout_id: id }]);
    }
    return openWorkout(id);
  }
}

/* Edit-dialog fields update the draft as you type without re-rendering (a
   re-render would steal focus); only the sport picker re-renders, since it
   changes the distance unit. */
document.getElementById('app').addEventListener('scroll', e => {
  if (!e.target.hasAttribute || !e.target.hasAttribute('data-sync-log')) return;
  const log = e.target;
  syncLogTop = log.scrollTop + log.clientHeight >= log.scrollHeight - 8 ? null : log.scrollTop;
}, true);

document.getElementById('app').addEventListener('focusin', e => {
  const row = state.editDraft && e.target.closest && e.target.closest('[data-we-row]');
  if (row) weSelect(row.getAttribute('data-we-row'), false);
});
document.getElementById('app').addEventListener('input', e => {
  const editField = e.target.getAttribute && e.target.getAttribute('data-edit-field');
  if (editField && state.editDraft) {
    state.editDraft[editField] = e.target.value;
    if (editField === 'name') { const t = document.getElementById('we-title'); if (t) t.textContent = e.target.value || 'New workout'; }
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-step') && state.editDraft
      && !STEP_SHAPE_KEYS.includes(e.target.getAttribute('data-sk'))) editStepField(e.target, false);
  const syncField = e.target.getAttribute && e.target.getAttribute('data-sync-field');
  if (syncField) {
    state.syncForm[syncField] = e.target.value;
    const cmd = document.querySelector('[data-sync-cmd]');
    if (cmd) cmd.textContent = ['python sync_garmin.py'].concat(syncArgs(state.syncForm)).join(' ');
  }
  const goalField = e.target.getAttribute && e.target.getAttribute('data-goal-field');
  if (goalField && state.goalDraft) {
    state.goalDraft[goalField] = e.target.value;
    if (state.goalError) { state.goalError = ''; const el = document.querySelector('.goal-error'); if (el) el.remove(); }
  }
});

document.getElementById('app').addEventListener('change', e => {
  if (e.target.hasAttribute && e.target.hasAttribute('data-tz-select')) return tzSubmit(e.target.value);
  if (e.target.hasAttribute && e.target.hasAttribute('data-season-goal')) return seasonSubmit('season-goal-race', { race_id: e.target.value || null });
  if (e.target.hasAttribute && e.target.hasAttribute('data-season-link')) return e.target.value ? seasonSubmit('plan-season', { season_id: e.target.value }) : undefined;
  if (e.target.hasAttribute && e.target.hasAttribute('data-sync-mode')) { state.syncForm.mode = e.target.value; state.syncFormError = ''; return render(); }
  if (e.target.getAttribute && e.target.getAttribute('data-goal-field') === 'date' && state.goalDraft) {
    state.goalDraft.date = e.target.value;
    state.goalError = '';
    return render();
  }
  if (e.target.id === 'phase-select') {
    const p = (PLAN.phases || []).find(x => x.name === e.target.value);
    if (p) {
      state.planWeekNumber = p.startWeek;
      const w = weekByNumber(p.startWeek);
      if (w && w.startDate) state.monthKey = String(w.startDate).slice(0, 7);
      render();
    }
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-step') && state.editDraft) {
    if (STEP_SHAPE_KEYS.includes(e.target.getAttribute('data-sk'))) editStepField(e.target, true);
    return;
  }
  const editField = e.target.getAttribute && e.target.getAttribute('data-edit-field');
  if (editField && state.editDraft) {
    const d = state.editDraft;
    if (editField === 'sport') {
      // Strength steps and run/bike/swim steps don't carry over to each other.
      const was = d.sport, next = e.target.value;
      if (d.steps.length && ((was === 'strength') !== (next === 'strength') || !STEP_SPORTS.includes(next))) {
        if (!confirm('Changing to ' + next + ' clears this workout\'s steps. Continue?')) { e.target.value = was; return; }
        d.steps = []; d.preview = null;
      }
      d.sport = next;
      render();
      schedulePreview(true);
      return;
    }
    d[editField] = e.target.value;
    return;
  }
  if (state.calendar && state.saving && e.target.closest && e.target.closest('[data-cal-default], [data-cal-field]')) return;
  if (state.calendar && e.target.hasAttribute && e.target.hasAttribute('data-cal-default')) {
    if (e.target.value) saveCalendarSchedule(e.target.value, state.calendar.slots);
    return;
  }
  if (state.calendar && e.target.hasAttribute && e.target.hasAttribute('data-cal-addsport')) {
    const slot = e.target.value ? nextCalendarSlot(state.calendar, e.target.value) : null;
    if (slot) saveCalendarSchedule(state.calendar.defaultTime, state.calendar.slots.concat([slot]));
    else render();
    return;
  }
  const calField = e.target.getAttribute && e.target.getAttribute('data-cal-field');
  if (calField && state.calendar) {
    const i = Number(e.target.getAttribute('data-index'));
    if (!e.target.value) return;
    const slots = state.calendar.slots.map((s, j) => j === i ? Object.assign({}, s, { [calField]: e.target.value }) : s);
    saveCalendarSchedule(state.calendar.defaultTime, slots);
    return;
  }
  const ovKey = e.target.getAttribute && e.target.getAttribute('data-ov');
  if (ovKey && !READ_ONLY) {
    const v = e.target.value.trim();
    const op = { op: 'set_zones' };
    op[ovKey] = v === '' ? null : v;
    saveOps([op]);
  }
});

document.getElementById('app').addEventListener('dragstart', e => {
  const card = e.target.closest('[data-drag-id]');
  if (!card) return;
  card.classList.add('dragging');
  e.dataTransfer.setData('text/plain', card.getAttribute('data-drag-id'));
  e.dataTransfer.effectAllowed = 'move';
});
document.getElementById('app').addEventListener('dragend', e => {
  const card = e.target.closest('[data-drag-id]');
  if (card) card.classList.remove('dragging');
  document.querySelectorAll('.day-col.drag-over').forEach(el => el.classList.remove('drag-over'));
});
document.getElementById('app').addEventListener('dragover', e => {
  const col = e.target.closest('[data-day-date]');
  if (!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const dayCol = col.closest('.day-col');
  if (dayCol) dayCol.classList.add('drag-over');
});
document.getElementById('app').addEventListener('dragleave', e => {
  const dayCol = e.target.closest && e.target.closest('.day-col');
  if (dayCol && !dayCol.contains(e.relatedTarget)) dayCol.classList.remove('drag-over');
});
document.getElementById('app').addEventListener('drop', e => {
  const col = e.target.closest('[data-day-date]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.day-col.drag-over').forEach(el => el.classList.remove('drag-over'));
  const id = e.dataTransfer.getData('text/plain');
  const newDate = col.getAttribute('data-day-date');
  if (!id || !newDate || READ_ONLY) return;
  const hit = workoutById(id);
  if (!hit || hit.date === newDate) return;
  saveOps([{ op: 'move_workout', workout_id: id, date: newDate }]);
});

/* Swipe left / right on the Plan tab to change week. Only a clearly
   sideways, reasonably quick swipe counts, so scrolling the week (or a
   long-press to drag a workout) never flips it. (Having a touch listener
   also turns on iOS Safari's :active tap feedback.) */
function inSideScroller(el) {
  for (; el && el !== document.body; el = el.parentElement) {
    const ox = getComputedStyle(el).overflowX;
    if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth) return true;
  }
  return false;
}
let swipe = null;
document.addEventListener('touchstart', e => {
  swipe = null;
  if (e.touches.length !== 1 || state.tab !== 'plan' || (window.WD && window.WD.isOpen()) || state.editId) return;
  const t = e.touches[0];
  if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;   // leave the screen edges to iOS
  if (!e.target.closest || !e.target.closest('.scroller') || e.target.closest('input, select, textarea')) return;
  if (inSideScroller(e.target)) return;
  swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchcancel', () => { swipe = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y, took = Date.now() - swipe.at;
  swipe = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2 || took > 700) return;
  stepWeek(dx < 0 ? 1 : -1);                        // swipe left → next week
}, { passive: true });

document.addEventListener('keydown', e => {
  if (window.WD && window.WD.isOpen()) return;   // the workout view has the keys
  if (e.key === 'Escape' && state.weShape) { state.weShape = null; return render(); }   // a shape menu closes first
  if (e.key === 'Escape' && state.editId) { state.editId = null; state.editDraft = null; render(); }
  if (state.tab === 'plan' && !state.editId) {
    if (e.key === 'ArrowLeft') stepWeek(-1);
    if (e.key === 'ArrowRight') stepWeek(1);
  }
});

/* The shared site nav (tools/navbar.py, injected by the server): Plan and
   Settings are this page, so they switch views in place — and highlight. */
function setView(view) {
  state.tab = view;
  if (view === 'settings') state.settingsCat = null;
  try {
    const url = new URL(location.href);
    if (view === 'settings') url.searchParams.set('view', 'settings'); else url.searchParams.delete('view');
    history.replaceState(history.state, '', url.toString());
  } catch (e) { /* history unavailable — the view just isn't kept */ }
  const more = document.getElementById('gm-nav-more');
  if (more) more.checked = false;
  document.querySelectorAll('#gm-nav [data-nav]').forEach(el => {
    const key = el.getAttribute('data-nav');
    el.classList.toggle('gm-nav__link--active', key === view);
    if (key === view) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    if (key === 'more') el.classList.toggle('gm-nav__more-btn--active', view === 'settings');
  });
  render();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const link = e.target.closest && e.target.closest('[data-nav="plan"], [data-nav="settings"]');
  if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  if (!link.closest('#gm-nav') && !link.closest('.gm-nav-more-sheet')) return;
  e.preventDefault();
  setView(link.getAttribute('data-nav'));
});

/* ?workout=<id> opens that workout on its week (Today's cards and the
   shared view's "Open in plan" link here); ?do=edit|duplicate|delete goes
   straight to that action (the shared view's menu, opened on another page).
   Both are dropped so a reload doesn't repeat them. */
const URL_WORKOUT = (function () {
  const q = new URLSearchParams(APP_QUERY);
  const id = q.get('workout');
  const hit = id && workoutById(id);
  if (!hit) return null;
  state.tab = 'plan';
  state.planWeekNumber = hit.week;
  try {
    const url = new URL(location.href);
    url.searchParams.delete('workout');
    url.searchParams.delete('do');
    history.replaceState(history.state, '', url.toString());
  } catch (e) { /* history unavailable */ }
  return { id, act: q.get('do') };
})();

render();
if (URL_WORKOUT) {
  if (['edit', 'duplicate', 'delete'].includes(URL_WORKOUT.act)) workoutAction(URL_WORKOUT.act, URL_WORKOUT.id);
  else openWorkout(URL_WORKOUT.id);
}

/* The Season page is a separate page load (Week / Month switch in place), so
   let the browser start loading it as soon as the pointer rests on a link to
   it — the click then shows it instantly. Browsers without speculation
   rules just navigate as usual. */
(function () {
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules'))) return;
  const rules = document.createElement('script');
  rules.type = 'speculationrules';
  rules.textContent = JSON.stringify({ prerender: [{ urls: [appLink('/training-plan/season')], eagerness: 'moderate' }] });
  document.head.appendChild(rules);
})();
if (state.tab === 'settings') setView('settings');
</script>
<style>/* Settings: category list + form pane on a desktop; on a phone the list, then
   one category's page with a back arrow. */

  background:var(--color-neutral-900); color:var(--color-accent-300); }

  .set-cat { background:transparent; box-shadow:none; }
  .set-cat:hover { background:var(--color-neutral-900); }

}
/* Two threshold fields side by side: equal columns that can shrink, and the
   inputs lined up along the bottom even when one label wraps. */
.field-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-bottom:10px; align-items:end; }
.field-pair .field > label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.field-pair .input { height:36px; }
